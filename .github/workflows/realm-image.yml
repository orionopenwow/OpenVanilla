# Source: packaging/workflows/realm-image.yml (Ship.bat and Release.bat copy it into .github/workflows).
# Builds ghcr.io/orionopenwow/openvanilla-realm: the upstream realm image with Open Vanilla's patches,
# and ghcr.io/orionopenwow/openvanilla-mangos: the world server with realm/mangos/*.patch.
# The realm image rebuilds from the exact commit the upstream image was built from (its revision
# label), so the service and the browser client inside it always match.
#
# Runs on every push to stable, every Monday (to follow upstream) and by hand, but each image is
# only BUILT when its inputs changed: a fingerprint of the upstream image plus every file that goes
# into it is kept as an "in-<hash>" tag. A run whose fingerprint already exists just points latest
# at that image (seconds). By hand, "force" rebuilds anyway. (No path filter on the push trigger:
# GitHub ignores path filters on pushes of more than 300 files, which skipped a needed build.)
name: realm-image
on:
  push:
    branches: [stable]   # images for the live realm come from released code only
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if an image with the same inputs exists"
        type: boolean
        default: false
      ship:
        description: "Ship profile (fat LTO): ~5% less CPU in the world, but ~40 min instead of ~10"
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: realm-image      # one run at a time; a push during a build waits for it
  cancel-in-progress: false
env:
  # bump to rebuild both images once without changing their inputs (a build-recipe change)
  RECIPE: "3"
jobs:
  # The realm image. Rust is compiled on the runner (not inside Docker) so its build cache survives
  # between runs: a one-patch change recompiles the crates it touches instead of the whole
  # workspace (~45 min before, cold, inside Docker). realm/Dockerfile only lays the results onto
  # the upstream image. The release profile by default; the "ship" profile (fat LTO, ~5% less CPU
  # in the world, ~40 min) only when a manual run asks for it.
  build:
    # 22.04 on purpose: its glibc (2.35) is older than the upstream image's Debian bookworm (2.36),
    # so the realm binary built here runs inside that image. A newer runner would not.
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable          # the weekly and manual builds also use released code
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upstream image and its commit
        id: base
        # Pinned to upstream's image of wenilla def2a7b (wenilla-realm 1806b46), the code our
        # realm/patches are made for. Upstream's next pin (wenilla 9a5c50b, PR #32) merged 221 benilla
        # commits with a new Lua engine and 8 of our patches no longer apply. Move this pin only
        # after porting the patches and testing them on a test realm (staging).
        run: |
          BASE=ghcr.io/arnesen/wenilla-realm:sha-1806b46
          docker pull -q "$BASE"
          REV=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$BASE")
          DIGEST=$(docker inspect -f '{{ index .RepoDigests 0 }}' "$BASE")
          PROFILE=release; [ "${{ inputs.ship }}" = true ] && PROFILE=ship
          echo "rev=$REV" >> "$GITHUB_OUTPUT"; echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"; echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "Upstream $DIGEST built from wenilla $REV; $PROFILE profile"
          case "$REV" in def2a7b*) ;; *) echo "::error::$BASE is wenilla $REV, not def2a7b: realm/patches won't apply"; exit 1 ;; esac
      - name: Already built? (fingerprint of everything that goes into the image)
        id: same
        run: |
          IMG=ghcr.io/orionopenwow/openvanilla-realm
          H=$( { echo "recipe $RECIPE"; echo "base ${{ steps.base.outputs.digest }}"; echo "profile ${{ steps.base.outputs.profile }}";
                 git ls-files -s realm/Dockerfile realm/patches realm/login-backdrop; } | sha256sum | cut -c1-16)
          echo "tag=in-$H" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" != "true" ] && docker buildx imagetools inspect "$IMG:in-$H" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$IMG:latest" -t "$IMG:${{ steps.base.outputs.rev }}" "$IMG:in-$H"
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "### openvanilla-realm: unchanged (in-$H), latest points at it; no build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "Inputs in-$H not built yet: building"
          fi
      - name: Room for the build (and 20 GB swap for the ship profile)
        if: steps.same.outputs.hit != 'true'
        # Fat LTO needs more memory than the runner's 16 GB ("cannot allocate memory"); unused
        # preinstalled SDKs make room for the build cache and a swap file.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          if [ "${{ steps.base.outputs.profile }}" = ship ]; then
            sudo swapoff -a || true
            sudo rm -f /mnt/swapfile /swapfile
            avail=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9)
            dir=/mnt; [ "${avail:-0}" -ge 30 ] || dir=
            sudo fallocate -l 20G "$dir/swapfile" && sudo chmod 600 "$dir/swapfile"
            sudo mkswap "$dir/swapfile" >/dev/null && sudo swapon "$dir/swapfile"
            sudo sysctl -w vm.overcommit_memory=1 vm.swappiness=60
          fi
          free -h; df -h / /mnt
      - name: wenilla at that commit + Open Vanilla patches
        if: steps.same.outputs.hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/Arnesen/wenilla realm/wenilla
          git -C realm/wenilla checkout "${{ steps.base.outputs.rev }}"
          for p in realm/patches/*.patch; do echo "applying $p"; git -C realm/wenilla apply --whitespace=nowarn "../../$p"; done
      - name: Build tools
        if: steps.same.outputs.hit != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends clang lld cmake pkg-config brotli libssl-dev libasound2-dev libudev-dev
      # Compiled crates (ours too), wasm-bindgen-cli (~/.cargo/bin) and the target folder survive
      # between runs. One cache per upstream commit and profile.
      - uses: Swatinem/rust-cache@v2
        if: steps.same.outputs.hit != 'true'
        with:
          workspaces: realm/wenilla -> target
          key: ${{ steps.base.outputs.rev }}-${{ steps.base.outputs.profile }}
          cache-workspace-crates: true
      - uses: actions/cache@v4
        if: steps.same.outputs.hit != 'true'
        with:
          path: |
            realm/wenilla/tools/wasi-sdk
            realm/wenilla/tools/binaryen
          key: web-tools-${{ steps.base.outputs.rev }}
      - name: Browser client and realm service
        if: steps.same.outputs.hit != 'true'
        working-directory: realm/wenilla
        # rust-toolchain.toml picks the compiler; web-setup pins wasm-bindgen to Cargo.lock. A module
        # without wasm-opt's -O3 pass fails the build (WEB_REQUIRE_OPT, patch 0020). The ship build
        # falls back to the release profile if it runs out of memory, rather than not shipping.
        run: |
          P=${{ steps.base.outputs.profile }}
          bash scripts/web-setup.sh
          if [ "$P" = ship ]; then
            CARGO_BUILD_JOBS=2 WEB_GPU=1 WEB_PROFILE=ship WEB_REQUIRE_OPT=1 bash scripts/web-build.sh \
              || { echo "ship build failed (memory?): building with the release profile instead";
                   WEB_GPU=1 WEB_PROFILE=release WEB_REQUIRE_OPT=1 bash scripts/web-build.sh; }
          else
            WEB_GPU=1 WEB_PROFILE=release WEB_REQUIRE_OPT=1 bash scripts/web-build.sh
          fi
          cargo build --release --locked -p wenilla-realm
          rm -rf ../out && mkdir -p ../out
          cp -r web/dist ../out/www && rm -f ../out/www/index.html
          cp target/release/wenilla-realm ../out/wenilla-realm
          ls -la ../out
      - name: The service runs inside the upstream image
        if: steps.same.outputs.hit != 'true'
        run: |
          out=$(docker run --rm --entrypoint "" -v "$PWD/realm/out:/o:ro" "${{ steps.base.outputs.digest }}" \
                sh -c 'ldd /o/wenilla-realm' 2>&1) || { echo "$out"; echo "::warning::could not run ldd in the base image; skipped the check"; exit 0; }
          echo "$out"
          if echo "$out" | grep -q "not found"; then echo "::error::the realm binary needs libraries the upstream image doesn't have"; exit 1; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.same.outputs.hit != 'true'
      - uses: docker/build-push-action@v6
        if: steps.same.outputs.hit != 'true'
        with:
          context: realm
          build-args: BASE=${{ steps.base.outputs.digest }}
          push: true
          tags: |
            ghcr.io/orionopenwow/openvanilla-realm:latest
            ghcr.io/orionopenwow/openvanilla-realm:${{ steps.base.outputs.rev }}
            ghcr.io/orionopenwow/openvanilla-realm:${{ steps.same.outputs.tag }}
  # The world server with the WNL hook (realm/mangos): mangosd rebuilt at the exact CMaNGOS and
  # PlayerBots commits the upstream image was built from, dropped into that image. Compiled with
  # ccache, kept between runs (actions/cache + buildkit-cache-dance), so a patch-only change
  # recompiles only the files it touches.
  mangos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable          # the weekly and manual builds also use released code
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upstream image and its commits
        id: base
        run: |
          BASE=ghcr.io/arnesen/wenilla-realm-mangos:latest
          docker pull -q "$BASE"
          LABEL=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$BASE")
          DIGEST=$(docker inspect -f '{{ index .RepoDigests 0 }}' "$BASE")
          # The revision label is usually the wenilla-realm commit the image was built from (CI's
          # metadata labels override the Dockerfile's), not a CMaNGOS commit. That commit's
          # upstreams.env holds the exact CMaNGOS and PlayerBots pins the image was built with.
          RAW=https://raw.githubusercontent.com/Arnesen/wenilla-realm
          if PINS=$(curl -fsSL "$RAW/$LABEL/upstreams.env"); then
            echo "Label $LABEL is a wenilla-realm commit; reading its pins"
          else
            echo "Label $LABEL is not a wenilla-realm commit; treating it as the CMaNGOS commit"
            PINS=$(curl -fsSL "$RAW/main/upstreams.env" | grep -v '^MANGOS_CLASSIC_COMMIT='; echo "MANGOS_CLASSIC_COMMIT=$LABEL")
          fi
          REV=$(printf '%s\n' "$PINS" | sed -n 's/^MANGOS_CLASSIC_COMMIT=//p')
          BOTS=$(printf '%s\n' "$PINS" | sed -n 's/^PLAYERBOTS_COMMIT=//p')
          [ -n "$REV" ] && [ -n "$BOTS" ] || { echo "Could not work out the CMaNGOS/PlayerBots commits"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"; echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"; echo "bots=$BOTS" >> "$GITHUB_OUTPUT"
          echo "Upstream $DIGEST built from mangos-classic $REV (playerbots $BOTS)"
      - name: Already built? (fingerprint of everything that goes into the image)
        id: same
        run: |
          IMG=ghcr.io/orionopenwow/openvanilla-mangos
          H=$( { echo "recipe $RECIPE"; echo "base ${{ steps.base.outputs.digest }}";
                 echo "mangos ${{ steps.base.outputs.rev }} bots ${{ steps.base.outputs.bots }}";
                 git ls-files -s realm/mangos; } | sha256sum | cut -c1-16)
          echo "tag=in-$H" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" != "true" ] && docker buildx imagetools inspect "$IMG:in-$H" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$IMG:latest" -t "$IMG:${{ steps.base.outputs.rev }}" "$IMG:in-$H"
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "### openvanilla-mangos: unchanged (in-$H), latest points at it; no build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "Inputs in-$H not built yet: building"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.same.outputs.hit != 'true'
      - name: Restore the compiler cache
        if: steps.same.outputs.hit != 'true'
        uses: actions/cache@v4
        with:
          path: ccache-mangos
          # a new entry per CMaNGOS commit + fingerprint; the newest older one seeds it
          key: ccache-mangos-${{ steps.base.outputs.rev }}-${{ steps.same.outputs.tag }}
          restore-keys: |
            ccache-mangos-${{ steps.base.outputs.rev }}-
            ccache-mangos-
      - name: Hand the compiler cache to the Docker build (and take it back after)
        if: steps.same.outputs.hit != 'true'
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            { "ccache-mangos": "/root/.ccache" }
      - uses: docker/build-push-action@v6
        if: steps.same.outputs.hit != 'true'
        with:
          context: realm/mangos
          build-args: |
            BASE=${{ steps.base.outputs.digest }}
            MANGOS_CLASSIC_COMMIT=${{ steps.base.outputs.rev }}
            PLAYERBOTS_COMMIT=${{ steps.base.outputs.bots }}
          push: true
          tags: |
            ghcr.io/orionopenwow/openvanilla-mangos:latest
            ghcr.io/orionopenwow/openvanilla-mangos:${{ steps.base.outputs.rev }}
            ghcr.io/orionopenwow/openvanilla-mangos:${{ steps.same.outputs.tag }}
          cache-from: type=gha,scope=mangos
          cache-to: type=gha,mode=max,scope=mangos
