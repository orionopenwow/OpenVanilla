[workspace]
resolver = "2"
members = ["crates/forge-core", "crates/forge-cli", "app/src-tauri"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
wow-mpq = "0.7"
wow-blp = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = "1"
png = "0.17"
anyhow = "1"
thiserror = "2"
walkdir = "2"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
hex = "0.4"
sha2 = "0.10"
mlua = { version = "0.10", features = ["lua51", "vendored", "send", "serialize"] }
