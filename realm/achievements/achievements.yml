# Open Vanilla achievements: the catalogue (source of truth).
#
# tools/gen_achievements.py turns this file into the addon's Data.lua, the world SQL
# (realm/classicplus/pending/classicplus_achievements.sql) and www/achievements.json, and checks it.
# Ids are stable forever: never renumber or reuse one (players' saved achievements point at them).
# Achievements give points and recognition only, never power.
#
# Fields: id, name, description, points (0 for Feats of Strength), category, icon (a 1.12 texture path),
#   criteria (every entry must be met; see the criteria types below), and optionally
#   faction (alliance|horde), classes [WARRIOR, ...], need (how many criteria entries are enough),
#   realm_first (only the first player on the realm gets it), group_first (the whole group that does it first).
#
# Criteria types (ids are CMaNGOS classic: creature_template.entry, quest_template.entry,
# AreaTable zone ids, SkillLine ids, Faction ids, battleground map ids):
#   level {level}                       reach a character level
#   quests {count}                      complete (turn in) this many different quests
#   zone_quests {zone, alliance, horde} complete this many quests whose quest_template.ZoneOrSort is the zone
#   quest {quest} | {quests: [..]}      complete the quest (any one of the list: racial variants)
#   explore {zone}                      explore the zone (the server counts its explorable sub-areas)
#   meta {achievement}                  earn another achievement
#   kill {creature} | {creatures: [..]} get kill credit (group credit counts); optional count, no_deaths, within (seconds since entering the instance)
#   skill {skill, value}                raise a skill to a value
#   skills_at {value, count, skills}    have count of the listed skills at value
#   reputation {faction, standing}      reach a standing (exalted)
#   exalted {count}                     be exalted with this many factions
#   money {gold}                        hold this much gold at once
#   bags {count, slots}                 equip count bags with at least slots each
#   pets {count}                        own this many different companion pets (lists.pet_items)
#   item {item} | {items: [..]}         own the item (bags or bank)
#   honor_kills {count}                 lifetime honorable kills
#   bg_wins {map, count}                battleground wins (489 Warsong Gulch, 529 Arathi Basin, 30 Alterac Valley)
#   pvp_rank {rank}                     highest PvP rank reached (1..14)

